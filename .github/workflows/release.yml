name: Release Binaries

permissions:
  contents: write

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-release:
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64-gnu
            use-cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64-msvc
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Install Cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binaries (Cargo)
        if: matrix.use-cross != true
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Build Binaries (Cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package Release (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release_pkg
          cp target/${{ matrix.target }}/release/relay-gateway release_pkg/
          cp target/${{ matrix.target }}/release/relay-agent release_pkg/
          cd release_pkg
          tar -czvf ../relaycli-${{ matrix.name }}.tar.gz relay-gateway relay-agent
          
      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_pkg
          Copy-Item target\${{ matrix.target }}\release\relay-gateway.exe release_pkg\
          Copy-Item target\${{ matrix.target }}\release\relay-agent.exe release_pkg\
          Compress-Archive -Path release_pkg\* -DestinationPath relaycli-${{ matrix.name }}.zip

      - name: Upload Release Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: relaycli-${{ matrix.name }}
          path: relaycli-${{ matrix.name }}.tar.gz
          
      - name: Upload Release Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: relaycli-${{ matrix.name }}
          path: relaycli-${{ matrix.name }}.zip

      - name: Upload Release Asset (Linux)
        if: runner.os == 'Linux' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: relaycli-${{ matrix.name }}.tar.gz

      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: relaycli-${{ matrix.name }}.zip
